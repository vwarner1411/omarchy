# Celery 5.6 clients use transient non-exclusive control/reply queues.
# RabbitMQ 4.3 denies these by default, causing a continuous reconnect loop.
# Remove after all clients use exclusive or durable control/event queues.
# https://www.rabbitmq.com/docs/queues#durability
deprecated_features.permit.transient_nonexcl_queues = true

# Rotate inside RabbitMQ even when the optional logrotate timer is absent.
log.file.rotation.size = 104857600
log.file.rotation.count = 5
log.file.rotation.compress = true
